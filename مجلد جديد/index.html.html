<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WORLD STAR STORE (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070912; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.03); --line:rgba(255,255,255,.09);
  --violet:#8b6cff; --cyan:#2fd8e0; --gold:#f2b544; --txt:#f3f5fc; --sub:#8b93ab; --danger:#ff6371;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(680px 480px at 8% -6%, #6a4dff33, transparent 60%),
    radial-gradient(620px 440px at 100% 8%, #22d8e02b, transparent 60%),
    radial-gradient(900px 600px at 50% 120%, #ff6b8f18, transparent 60%);
}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#232840;border-radius:8px}
.num,.eng{font-family:'Sora',sans-serif}
h1,h2,h3{font-family:'Cairo',sans-serif;letter-spacing:.2px}

header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 26px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:#0a0d18b3;backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:32px;width:auto;filter:drop-shadow(0 0 14px #8b6cff55)}
.brand .word{font-family:'Sora',sans-serif;font-weight:800;font-size:18px;letter-spacing:1.5px;
  background:linear-gradient(90deg,#fff,#b9c3e0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dd{position:relative}
.dd-btn{all:unset;display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:8px 12px;font-family:inherit;font-size:12px;cursor:pointer}
.dd-btn:hover{border-color:var(--violet)}
.dd-btn .care{font-size:10px;color:var(--sub)}
.dd-menu{position:absolute;top:calc(100% + 8px);left:0;background:#0e1120;border:1px solid var(--line);border-radius:14px;
  min-width:150px;padding:6px;display:none;z-index:80;box-shadow:0 20px 40px -14px #000c}
.dd-menu.open{display:block}
.dd-item{padding:9px 12px;border-radius:9px;font-size:13px;cursor:pointer;color:var(--txt)}
.dd-item:hover{background:var(--glass)}
.dd-item.on{color:var(--cyan);font-weight:700}
.pill{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#3a2e6a55,#1a2b4055);
  border:1px solid var(--line);padding:8px 15px;border-radius:999px;font-weight:800;font-size:13px}
.coins{color:var(--gold)}
.iconbtn{position:relative;background:var(--glass);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;font-size:16px}
.iconbtn:hover{border-color:var(--violet);box-shadow:0 0 0 4px #8b6cff22}
.badge{position:absolute;top:-6px;left:-6px;background:var(--violet);color:#fff;font-size:10px;font-weight:800;
  border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* hero */
.hero{max-width:1320px;margin:26px auto 0;padding:0 24px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);
  padding:6px 14px;border-radius:999px;font-size:12px;color:var(--sub);margin-bottom:16px}
.hero-eyebrow b{color:var(--cyan)}
.hero h1{font-size:40px;line-height:1.15;margin:0 0 14px;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--sub);font-size:15px;max-width:480px;margin:0 0 22px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat-chip{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:12px;color:var(--sub)}
.stat-chip b{display:block;color:var(--txt);font-family:'Sora';font-size:17px;font-weight:700}
.hero-visual{position:relative;height:320px}
.hv-card{position:absolute;width:230px;border-radius:22px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 30px 60px -20px #000c;background:#0d1120}
.hv-card img{width:100%;display:block}
.hv-card.a{top:10px;right:40px;transform:rotate(4deg);z-index:2}
.hv-card.b{top:70px;right:220px;transform:rotate(-7deg);z-index:1;opacity:.85}
.hv-glow{position:absolute;inset:0;background:radial-gradient(220px 220px at 60% 30%,#8b6cff3d,transparent 70%);filter:blur(10px)}

/* chip nav */
.chipnav-wrap{position:sticky;top:64px;z-index:40;background:#070912ee;backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);margin-top:30px}
.chipnav{max-width:1320px;margin:0 auto;display:flex;gap:8px;padding:14px 24px;overflow-x:auto;scrollbar-width:none}
.chipnav::-webkit-scrollbar{display:none}
.chip-tab{all:unset;cursor:pointer;white-space:nowrap;padding:9px 18px;border-radius:999px;font-weight:700;font-size:13px;
  color:var(--sub);border:1px solid transparent;transition:.15s}
.chip-tab:hover{background:var(--glass)}
.chip-tab.active{background:linear-gradient(90deg,var(--violet),#6f5ce0);color:#fff;box-shadow:0 6px 18px -6px #8b6cff88}

main{max-width:1320px;margin:0 auto;padding:26px 24px 60px}
.section-title{font-size:22px;font-weight:800;margin:2px 0 2px;display:flex;align-items:baseline;gap:10px}
.section-title .en{font-size:12px;color:var(--sub);font-weight:500;font-family:'Sora'}
.section-sub{color:var(--sub);font-size:13px;margin-bottom:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--glass2);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;
  transition:.25s;position:relative}
.card:hover{transform:translateY(-5px);border-color:#8b6cff77;box-shadow:0 18px 40px -18px #000b, 0 0 0 1px #8b6cff33}
.card .thumb{height:150px;position:relative;background:radial-gradient(circle at 50% 20%,#211a44,#0c0e1a);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .thumb .emoji{font-size:40px}
.ribbon{position:absolute;top:10px;right:-2px;background:linear-gradient(90deg,var(--gold),#ffd583);color:#241a02;
  font-size:11px;font-weight:800;padding:4px 12px;border-radius:6px 0 0 6px}
.card .body{padding:15px}
.card h3{margin:0 0 2px;font-size:16px;font-weight:800}
.card .en-name{font-size:11px;color:var(--sub);font-family:'Sora';margin-bottom:8px}
.card .price{color:var(--gold);font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;font-family:'Sora'}
.card .price .conv{color:var(--sub);font-size:11px;font-weight:500}
.card .cnt{color:var(--sub);font-size:12px;margin-top:4px}

.actions{display:flex;gap:8px;padding:0 15px 15px}
.btn{border:none;border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer;transition:.15s;flex:1;font-family:'Cairo'}
.btn-primary{background:linear-gradient(90deg,var(--violet),#6f5ce0);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:var(--violet)}
.btn-gold{background:linear-gradient(90deg,var(--gold),#ffd583);color:#241a02}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.overlay{position:fixed;inset:0;background:#02030add;backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.open{display:flex}
.modal{background:#0c0f1c;border:1px solid var(--line);border-radius:22px;max-width:540px;width:100%;
  max-height:86vh;overflow:auto;padding:0}
.modal .mhead{position:relative;height:160px}
.modal .mhead img{width:100%;height:100%;object-fit:cover}
.modal .mhead .close-x{position:absolute;top:12px;left:12px;background:#000000aa;width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal .mbody{padding:22px}
.modal h2{margin:0 0 4px;font-size:20px}
.tos{font-size:12px;color:var(--sub);background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.item-row:last-child{border-bottom:none}
.item-name{font-size:14px;font-weight:600}
.choice{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--sub);font-size:11px;padding:6px 10px;border-radius:999px;cursor:pointer}
.chip.sel{background:var(--violet);color:#fff;border-color:var(--violet)}
.modal-foot{display:flex;gap:10px;margin-top:16px}

.drawer-backdrop{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:105}
.drawer-backdrop.show{opacity:.28;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:380px;max-width:92vw;background:rgba(10,13,24,.88);backdrop-filter:blur(18px) saturate(150%);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.9,.25,1);z-index:110;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:translateX(0)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-head .htxt b{font-size:16px}
.drawer-head .htxt .cnt{display:block;color:var(--sub);font-size:11px;margin-top:2px;font-family:'Sora'}
.drawer-x{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--glass);border:1px solid var(--line);transition:.15s}
.drawer-x:hover{border-color:var(--violet)}
.line-item{display:flex;gap:12px;align-items:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:16px;
  padding:12px 13px;margin-bottom:10px;transition:.15s}
.line-item:hover{border-color:#8b6cff55}
.line-badge{flex:none;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#8b6cff33,#2fd8e022);color:var(--cyan)}
.line-body{flex:1;min-width:0}
.line-body .lname{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line-body .lmeta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;color:var(--sub)}
.icon-x{flex:none;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--sub);transition:.15s}
.icon-x:hover{background:#ff5d6c22;color:var(--danger)}
.group-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;color:var(--sub);font-size:12px;font-weight:700}
.group-head:first-child{margin-top:0}
.drawer-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 20px;text-align:center}
.drawer-empty svg{color:var(--sub);opacity:.6}
.drawer-empty p{color:var(--sub);font-size:13px;margin:0}
.drawer-body{flex:1;overflow:auto;padding:14px 18px}
.drawer-foot{padding:16px 18px;border-top:1px solid var(--line)}
.cart-line{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:10px}
.cart-line .top{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.cart-line .sub{color:var(--sub);font-size:12px;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
input.coupon{width:100%;background:#080a12;border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-family:inherit}
.empty{color:var(--sub);text-align:center;padding:40px 10px;font-size:13px}

.admin-badge{background:var(--danger);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;font-weight:800}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px}
.field label{font-size:12px;color:var(--sub);display:block;margin-bottom:6px}
.field input,.field select{width:100%;background:#080a12;border:1px solid var(--line);color:#fff;padding:9px 10px;border-radius:10px;font-family:inherit;margin-bottom:8px}

.notice{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(90deg,#f2b5441a,#f2b54408);
  border:1px solid #f2b54455;border-radius:14px;padding:13px 16px;margin-bottom:18px;font-size:13px;color:#f0dcae}
.notice svg{flex:none;margin-top:1px;color:var(--gold)}
.notice b{color:var(--gold)}

.topup-card{background:var(--glass2);border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;transition:.2s}
.topup-card:hover{border-color:#8b6cff77;transform:translateY(-4px)}
.topup-card .amt{font-size:26px;font-weight:800;color:var(--gold);font-family:'Sora'}
.topup-card .price{margin-top:4px;color:var(--sub);font-size:13px}

.wizard-progress{font-size:12px;color:var(--sub);margin-bottom:10px;font-family:'Sora'}
.wizard-item{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center;margin-bottom:16px}
.wizard-item .big{font-size:19px;font-weight:800;margin-bottom:4px}
.wizard-item .from{color:var(--sub);font-size:12px}
.wizard-btns{display:flex;flex-direction:column;gap:10px}
.iconbtn.bump{animation:cartBump .45s cubic-bezier(.3,1.6,.4,1)}
@keyframes cartBump{0%{transform:scale(1)}35%{transform:scale(1.28) rotate(-6deg)}60%{transform:scale(.94) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes flyToCart{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:var(--fly-to) scale(.3)}}
.fly-badge{position:fixed;z-index:150;pointer-events:none;background:var(--violet);color:#fff;font-size:11px;font-weight:800;
  border-radius:999px;padding:5px 10px;box-shadow:0 8px 20px -6px #8b6cff99;animation:flyToCart .55s ease forwards}left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#12172a;
  border:1px solid var(--violet);padding:12px 22px;border-radius:14px;z-index:200;transition:.25s;font-weight:700}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .hero-visual{display:none}
}
@media(max-width:560px){
  header{padding:12px 16px}
  .hero{padding:0 16px}
  .hero h1{font-size:30px}
}
</style>
</head>

function pulseCart(){
  const btn = document.getElementById('cartIconBtn');
  if(!btn) return;
  btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');
  const ev = window.event;
  if(ev && ev.target && ev.target.getBoundingClientRect){
    const rect = ev.target.getBoundingClientRect(), cartRect = btn.getBoundingClientRect();
    const dot = document.createElement('div');
    dot.className='fly-badge'; dot.textContent='+1';
    dot.style.left = (rect.left+rect.width/2-16)+'px';
    dot.style.top = rect.top+'px';
    const dx = (cartRect.left+cartRect.width/2)-(rect.left+rect.width/2);
    const dy = (cartRect.top+cartRect.height/2)-rect.top;
    dot.style.setProperty('--fly-to', `translate(${dx}px,${dy}px)`);
    document.body.appendChild(dot);
    setTimeout(()=>dot.remove(),600);
  }
}
function addPackageToCart(){

let discountCodes = {"SUMMER25":25, "WELCOME10":10};

function applyCoupon(){
  const v = document.getElementById('coupon').value.trim().toUpperCase();
  if(!v){ toast(lang==='ar'?'أدخل كود الخصم أولًا':'Enter a discount code first'); return; }
  if(discountCodes[v]){ appliedCode=v; appliedPct=discountCodes[v]; toast(lang==='ar'?`تم تطبيق كود ${v}`:`Code ${v} applied`); }
  else { appliedCode=null; appliedPct=0; toast(lang==='ar'?'كود الخصم غير صالح':'Invalid discount code'); }
  renderCart();
}
function removeCart(i){ cart.splice(i,1); renderCart(); updateBadges(); }
let wizQueue = [], wizIndex = 0;
function checkout(){
  const total = cart.reduce((s,c)=>s+c.price,0);
  const finalTotal = appliedPct? Math.round(total*(1-appliedPct/100)) : total;
  if(coins < finalTotal){ toast(lang==='ar'?'رصيدك من الكوينز غير كافٍ':'Not enough coins'); return; }
  coins -= finalTotal;
  appliedCode=null; appliedPct=0;
  wizQueue = [];
  cart.forEach(c=>{
    if(c.type==='package'){
      const p = packages[c.name];
      p.items.forEach(it=>{
        if(it.special){ bag.push({label:`${it.t} — ${c.name}`, ticket:true}); return; }
        if(it.choice){ wizQueue.push({label:it.t, pkg:c.name, giftable:!!it.giftable}); }
      });
    } else bag.push({label:c.name, ticket:!!c.ticket});
  });
  cart = []; closeDrawer('cart'); updateBadges();
  if(wizQueue.length){ wizIndex=0; document.getElementById('wizOverlay').classList.add('open'); renderWizStep(); }
  else toast(lang==='ar'?'تم الدفع بنجاح — العناصر وصلت فورًا':'Payment successful — items delivered instantly');
}
function renderWizStep(){
  const item = wizQueue[wizIndex], total = wizQueue.length;
  const dots = Array.from({length:total}).map((_,i)=>`<span style="width:${i===wizIndex?18:6}px;height:6px;border-radius:4px;
    background:${i<=wizIndex?'var(--violet)':'var(--line)'};display:inline-block;transition:.2s"></span>`).join('');
  document.getElementById('wizModal').innerHTML = `<div class="mbody">
    <div class="wizard-progress" style="display:flex;align-items:center;justify-content:space-between">
      <span>${lang==='ar'?'استلام عناصر الحزمة':'Redeeming package items'}</span>
      <span class="num">${wizIndex+1}/${total}</span></div>
    <div style="display:flex;gap:5px;margin-bottom:16px">${dots}</div>
    <div class="wizard-item"><div class="big">${item.label}</div><div class="from">${item.pkg}</div></div>
    <div class="wizard-btns">
      <button class="btn btn-primary" onclick="wizDecide('now')">${lang==='ar'?'استلام الآن':'Claim now'}</button>
      <button class="btn btn-ghost" onclick="wizDecide('later')">${lang==='ar'?'أضِفه للحقيبة':'Add to bag'}</button>
      ${item.giftable?`<button class="btn btn-gold" onclick="wizDecide('gift')">${lang==='ar'?'إهداء لصديق':'Gift a friend'}</button>`:''}
    </div></div>`;
}
function wizDecide(choice){
  const item = wizQueue[wizIndex];
  if(choice==='now'){ advanceWiz(); return; }
  if(choice==='later'){ bag.push({label:`${item.label} — ${item.pkg}`, ticket:false}); updateBadges(); advanceWiz(); return; }
  if(choice==='gift'){
    askInput(lang==='ar'?'Steam ID صديقك':"Friend's Steam ID",'steam:xxxx',(sid)=>{
      if(sid) bag.push({label:`${item.label} — ${item.pkg} (${lang==='ar'?'إهداء إلى':'gift to'} ${sid})`, ticket:false});
      updateBadges(); advanceWiz();
    });
  }
}
function advanceWiz(){
  wizIndex++;
  if(wizIndex>=wizQueue.length){ document.getElementById('wizOverlay').classList.remove('open'); toast(lang==='ar'?'تم استلام جميع العناصر بنجاح':'All items processed successfully'); }
  else renderWizStep();
}
function renderBag(){
  const body=document.getElementById('bagBody');
  if(!bag.length){ body.innerHTML=emptyState(lang==='ar'?'الحقيبة فارغة':'Your bag is empty', lang==='ar'?'تصفّح المتجر':'Browse store'); return; }
  const ready = bag.map((b,i)=>({...b,i})).filter(b=>!b.ticket);
  const ticketed = bag.map((b,i)=>({...b,i})).filter(b=>b.ticket);
  const line = b => `
    <div class="line-item"><div class="line-badge" style="${b.ticket?'background:linear-gradient(135deg,#f2b54433,#f2b54411);color:var(--gold)':''}">
      ${b.ticket?`<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 2.3 18a2 2 0 0 0 1.7 3h16a2 2 0 0 0 1.7-3l-8-14.1a2 2 0 0 0-3.4 0Z"/></svg>`

      <div class="line-body"><div class="lname">${b.label}</div></div>
      <button class="btn ${b.ticket?'btn-ghost':'btn-gold'}" style="flex:none;padding:7px 14px;font-size:12px" onclick="claim(${b.i})">${b.ticket?(lang==='ar'?'تواصل مع الإدارة':'Contact admin'):(lang==='ar'?'استلام':'Claim')}</button>
    </div>`;
  body.innerHTML =
    (ready.length? `<div class="group-head"><span>${lang==='ar'?'جاهزة للاستلام':'Ready to claim'}</span><span>${ready.length}</span></div>${ready.map(line).join('')}`:'')
    + (ticketed.length? `<div class="group-head"><span>${lang==='ar'?'تتطلب تواصل مع الإدارة':'Needs admin contact'}</span><span>${ticketed.length}</span></div>${ticketed.map(line).join('')}`:'');

function claim(i){
  const item = bag[i];
  if(item.ticket) toast(lang==='ar'?'يرجى فتح تذكرة دعم للتواصل مع الإدارة بخصوص هذا العنصر':'Please open a support ticket to contact admins about this item');
  else toast((lang==='ar'?'تم استلام: ':'Claimed: ')+item.label);
  bag.splice(i,1); renderBag(); updateBadges();
}

let testDriveLimit = 2, maintenanceMode = false;
function testDrivesLeft(){
  try{ const raw = JSON.parse(localStorage.getItem('ws_testdrives')||'[]'); const dayAgo = Date.now()-24*3600*1000;
    const recent = raw.filter(t=>t>dayAgo); localStorage.setItem('ws_testdrives', JSON.stringify(recent)); return testDriveLimit-recent.length;
  }catch(e){ return testDriveLimit; }
}

  toast((lang==='ar'?'جارٍ نقلك لتجربة ':'Teleporting to test ')+name);
  renderMain();
}

    <div class="section-sub">${lang==='ar'?'مسجّل الدخول كمسؤول — اضغط ⚙️ مرة أخرى لإخفاء اللوحة':'Logged in as admin — click ⚙️ again to hide the panel'}</div>
    <div class="admin-grid">
      <div class="field"><label>${lang==='ar'?'إضافة كوينز (Steam ID)':'Add coins (Steam ID)'}</label>
        <input id="a_steam" placeholder="steam:xxxx"><input id="a_amount" type="number" placeholder="${lang==='ar'?'عدد الكوينز':'Amount'}">
        <button class="btn btn-primary" style="width:100%" onclick="adminAddCoins()">${lang==='ar'?'إضافة':'Add'}</button></div>
      <div class="field"><label>${lang==='ar'?'إضافة كود خصم':'New discount code'}</label>
        <input id="a_code" placeholder="SUMMER25"><input id="a_pct" type="number" placeholder="%">
        <button class="btn btn-primary" style="width:100%" onclick="adminAddCoupon()">${lang==='ar'?'حفظ':'Save'}</button></div>
      <div class="field"><label>${lang==='ar'?'منح عنصر لحقيبة لاعب':'Grant item to player bag'}</label>
        <input id="a_item_steam" placeholder="steam:xxxx"><input id="a_item" placeholder="${lang==='ar'?'اسم العنصر':'Item name'}">
        <button class="btn btn-primary" style="width:100%" onclick="adminGiveItem()">${lang==='ar'?'منح':'Grant'}</button></div>
      <div class="field"><label>${lang==='ar'?'تعديل سعر مسيرة':'Edit path price'}</label>
        <select id="a_pkg">${Object.keys(packages).map(n=>`<option>${n}</option>`).join('')}</select>
        <input id="a_price" type="number" placeholder="${lang==='ar'?'سعر جديد':'New price'}">
        <button class="btn btn-primary" style="width:100%" onclick="adminEditPrice()">${lang==='ar'?'تحديث':'Update'}</button></div>
    </div>

    <div class="section-title" style="margin-top:26px;font-size:16px">${lang==='ar'?'إعدادات عامة':'General Settings'}</div>
    <div class="admin-grid">
      <div class="field"><label>${lang==='ar'?'وضع الصيانة':'Maintenance mode'}</label>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <input type="checkbox" id="a_maint" ${maintenanceMode?'checked':''} style="width:auto;margin:0">
          <span style="font-size:12px;color:var(--sub)">${lang==='ar'?'إخفاء المتجر عن الزوار مؤقتًا':'Temporarily hide store from visitors'}</span>
        </div>
        <button class="btn btn-primary" style="width:100%" onclick="adminSaveSettings()">${lang==='ar'?'حفظ الإعدادات':'Save settings'}</button></div>
      <div class="field"><label>${lang==='ar'?'الحد اليومي لتجربة المركبات':'Daily test-drive limit'}</label>
        <input id="a_testdrive" type="number" value="${testDriveLimit}" min="0">
        <span style="font-size:11px;color:var(--sub)">${lang==='ar'?'عدد المرات المسموحة كل 24 ساعة':'Allowed attempts every 24h'}</span></div>
    </div>

    <div class="section-title" style="margin-top:26px;font-size:16px">${lang==='ar'?'سجل النشاط':'Activity Log'}</div>
    <div class="field" style="max-height:220px;overflow:auto">
      ${adminLog.length? adminLog.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px">
        <span>${l.msg}</span><span class="num" style="color:var(--sub);flex:none">${l.t}</span></div>`).join('')
      : `<div style="color:var(--sub);font-size:12px;text-align:center;padding:14px 0">${lang==='ar'?'لا يوجد نشاط بعد':'No activity yet'}</div>`}
    </div>`;
  document.getElementById('main').appendChild(div);
}
function adminAddCoins(){
  const steam=document.getElementById('a_steam').value.trim(), amt=document.getElementById('a_amount').value.trim();
  if(!steam||!amt){ toast(lang==='ar'?'أدخل Steam ID والكمية':'Enter Steam ID and amount'); return; }
  toast(lang==='ar'?'تم إرسال أمر إضافة الكوينز (ينفَّذ عبر سكربت السيرفر)':'Coin grant queued (executed via server script)');
  pushLog((lang==='ar'?`إضافة ${amt} كوينز لـ ${steam}`:`Added ${amt} coins to ${steam}`));
}
function adminAddCoupon(){
  const code=(document.getElementById('a_code').value||'').trim().toUpperCase();
  const pct=parseInt(document.getElementById('a_pct').value);
  if(!code||!pct){ toast(lang==='ar'?'أدخل الكود والنسبة':'Enter code and percentage'); return; }
  discountCodes[code]=pct;
  toast((lang==='ar'?`تم إضافة كود ${code} بخصم ${pct}%`:`Added code ${code} at ${pct}% off`));
  pushLog((lang==='ar'?`كود خصم جديد: ${code} (${pct}%)`:`New discount code: ${code} (${pct}%)`));
}
function adminGiveItem(){
  const steam=document.getElementById('a_item_steam').value.trim(), item=document.getElementById('a_item').value.trim();
  if(!steam||!item){ toast(lang==='ar'?'أدخل Steam ID واسم العنصر':'Enter Steam ID and item name'); return; }
  toast(lang==='ar'?'تم إرسال العنصر لحقيبة اللاعب':'Item sent to player bag');
  pushLog((lang==='ar'?`منح "${item}" لـ ${steam}`:`Granted "${item}" to ${steam}`));
}
function adminEditPrice(){ const n=document.getElementById('a_pkg').value, v=parseInt(document.getElementById('a_price').value);
  if(v){ packages[n].price=v; renderMain(); toast((lang==='ar'?'تم تحديث سعر ':'Updated price of ')+n);
    pushLog((lang==='ar'?`تعديل سعر ${n} إلى ${v}`:`Updated ${n} price to ${v}`)); } }
function adminSaveSettings(){
  maintenanceMode = document.getElementById('a_maint').checked;
  testDriveLimit = parseInt(document.getElementById('a_testdrive').value)||2;
  toast(lang==='ar'?'تم حفظ الإعدادات':'Settings saved');
  pushLog((lang==='ar'?`تحديث الإعدادات — صيانة: ${maintenanceMode?'مفعّلة':'متوقفة'}، حد التجربة: ${testDriveLimit}`
    :`Settings updated — maintenance: ${maintenanceMode?'on':'off'}, test-drive limit: ${testDriveLimit}`));
}

let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------------- GENERIC INPUT MODAL (replaces window.prompt) ---------------- */
let inputCallback = null;
function askInput(title, placeholder, cb){
  inputCallback = cb;
  document.getElementById('inputModal').innerHTML = `<div class="mbody">
    <h2 style="font-size:16px;margin-bottom:14px">${title}</h2>
    <input class="coupon" id="genericInput" placeholder="${placeholder}" style="margin-bottom:6px">
    <div class="modal-foot" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="closeInput()">${lang==='ar'?'إلغاء':'Cancel'}</button>
      <button class="btn btn-primary" onclick="submitInput()">${lang==='ar'?'تأكيد':'Confirm'}</button>
    </div></div>`;
  document.getElementById('inputOverlay').classList.add('open');
  setTimeout(()=>{ const el=document.getElementById('genericInput'); if(el){ el.focus();
    el.addEventListener('keydown', e=>{ if(e.key==='Enter') submitInput(); }); } },60);
}
function closeInput(){ document.getElementById('inputOverlay').classList.remove('open'); inputCallback=null; }
function submitInput(){
  const el = document.getElementById('genericInput'); const v = el? el.value.trim() : '';
  const cb = inputCallback; closeInput(); if(cb) cb(v);
}
function contactStore(){
  toast(lang==='ar'?'يرجى فتح تذكرة دعم للتواصل مع المتجر قبل إتمام هذا الطلب':'Please open a support ticket to contact the store before this request');
}

renderNav(); renderMain(); updateBadges();
document.getElementById('pkgOverlay').addEventListener('click',e=>{ if(e.target.id==='pkgOverlay') closeOverlay(); });
</script>
</body>
</html>
